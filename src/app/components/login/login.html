<div class="auth-container">
  <div class="glass-card">
    <h2>Student Login</h2>
    <p class="subtitle">Welcome back! Please enter your details.</p>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label for="student_email">Email</label>
        <input type="email" id="student_email" name="student_email" autocomplete="off" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="student_password">Password</label>
        <input type="password" id="student_password" name="student_password" autocomplete="new-password" formControlName="password" placeholder="••••••••" />
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Sign In' }}
      </button>
    </form>

    <div class="info-box">
      <i class="fas fa-info-circle"></i>
      <p>Student accounts are created by the institute. Please contact the administrator if you need login credentials.</p>
    </div>
  </div>
</div>
