<div class="auth-container">
  <div class="glass-card">
    <h2>Student Registration</h2>
    <p class="subtitle">Create an account to manage your profile.</p>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" formControlName="name" placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="•••••••• (Min. 6 chars)" />
      </div>

      <button type="submit" class="submit-btn" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="switch-auth">
      Already have an account? <a routerLink="/login">Sign in here</a>
    </p>
  </div>
</div>
