<div class="not-found-container">
  <div class="not-found-card text-center">
    <div class="error-illustration">
      <div class="error-code">404</div>
      <div class="error-circle"></div>
      <div class="error-icon">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>
    </div>
    
    <h2>Lost in Transition?</h2>
    <p class="text-muted">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track!
    </p>

    <div class="action-buttons">
      <button class="btn btn-primary btn-lg px-4" (click)="goHome()">
        <i class="fa-solid fa-house me-2"></i>Back to Home
      </button>
      <a class="btn btn-outline-custom btn-lg px-4" routerLink="/" fragment="contact">
        <i class="fa-solid fa-circle-question me-2"></i>Contact Support
      </a>
    </div>
  </div>
</div>
